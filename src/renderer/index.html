<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Pomonoise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="timer" aria-label="Timer">
      <div id="phase" class="phase">Focus</div>
      <div id="time" class="time" role="timer">25:00</div>
      <div id="dots" class="dots" aria-label="Pomodoros completed"></div>
      <div class="buttons">
        <button id="toggle" class="primary">Start</button>
        <button id="skip">Skip</button>
        <button id="reset">Reset</button>
      </div>
    </section>

    <section class="noise" aria-label="Noise">
      <h2>Noise</h2>
      <div class="row">
        <button id="noise-toggle" aria-pressed="false">Off</button>
        <select id="noise-type" aria-label="Noise preset"></select>
      </div>
      <label class="row">Volume
        <input id="volume" type="range" min="0" max="1" step="0.01">
      </label>
      <label class="check">
        <input id="focus-only" type="checkbox"> Only play while focusing
      </label>

      <h2 class="eq-title">Curve</h2>
      <canvas id="eq" class="eq" tabindex="0" role="application"
        aria-label="Noise curve editor. Left and right arrows choose a frequency band, up and down change its level, Home resets it."></canvas>
      <div class="eq-foot">
        <span id="eq-readout" class="readout" aria-live="polite">Drag a point to shape the noise</span>
        <label class="check"><input id="show-spectrum" type="checkbox"> Live spectrum</label>
      </div>
    </section>

    <details class="settings">
      <summary>Settings</summary>
      <label>Focus (min) <input id="workMinutes" type="number" min="1" max="180"></label>
      <label>Short break (min) <input id="shortBreakMinutes" type="number" min="1" max="60"></label>
      <label>Long break (min) <input id="longBreakMinutes" type="number" min="1" max="120"></label>
      <label>Long break every <input id="longBreakEvery" type="number" min="2" max="12"> pomodoros</label>
      <label class="check"><input id="autoStartNext" type="checkbox"> Start next phase automatically</label>

      <h3>Chimes</h3>
      <div class="option">
        <label class="check"><input id="chimeOnStart" type="checkbox"> Chime when focus starts</label>
        <button id="preview-start" class="small" aria-label="Preview the start chime">Play</button>
      </div>
      <div class="option">
        <label class="check"><input id="chimeOnEnd" type="checkbox"> Chime when focus ends</label>
        <button id="preview-end" class="small" aria-label="Preview the end chime">Play</button>
      </div>

      <h3>Fade out noise</h3>
      <label class="check"><input id="fadeFocus" type="checkbox"> At the end of a focus session</label>
      <label class="check"><input id="fadeBreak" type="checkbox"> At the end of a break</label>
      <label>Fade duration (seconds) <input id="fadeSeconds" type="number" min="1" max="300"></label>
    </details>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
